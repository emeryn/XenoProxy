name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build --target test -t xenoproxy-tests ./backend

      - name: Run the test suite
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/backend xenoproxy-tests \
            pytest -q -p no:cacheprovider

      - name: Lint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/backend xenoproxy-tests \
            ruff check app tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly what the lock file says
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Lint
        run: npx eslint src
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  images:
    name: Images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Backend image
        run: docker build --target runtime -t xenoproxy-backend ./backend

      - name: Frontend image
        run: docker build -t xenoproxy-frontend ./frontend

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: xenoproxy_app
          POSTGRES_DB: xenoproxy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: docker build --target test -t xenoproxy-tests ./backend

      - name: Upgrade, and upgrade again
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          MASTER_KEY="$(openssl rand -base64 32)"
          docker run --rm --network host -v "$PWD:/repo" -w /repo/backend \
            -e BACKEND_DB_HOST=127.0.0.1 \
            -e BACKEND_DB_PORT=5432 \
            -e BACKEND_DB_NAME=xenoproxy \
            -e BACKEND_DB_USER=xenoproxy_app \
            -e BACKEND_DB_PASSWORD=ci \
            -e BACKEND_SECRET_KEY="$SECRET_KEY" \
            -e BACKEND_MASTER_KEY="$MASTER_KEY" \
            xenoproxy-tests sh -c '
              alembic upgrade head &&
              alembic stamp base &&
              alembic upgrade head &&
              alembic current'
