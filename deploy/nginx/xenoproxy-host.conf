# XenoProxy behind an Nginx installed on the host, rather than the bundled
# `proxy` container.
#
# Drop this in as a site (Debian/Ubuntu: /etc/nginx/sites-available/xenoproxy
# with a symlink in sites-enabled; RHEL/Alma: /etc/nginx/conf.d/xenoproxy.conf),
# replace xenoproxy.example.org with your name and the certificate paths with
# yours, then `nginx -t && systemctl reload nginx`.
#
# It expects the two loopback ports docker-compose.yml publishes:
#
#   127.0.0.1:8098 -> the frontend container (static assets)
#   127.0.0.1:8097 -> the API container
#
# and it expects the bundled proxy to be out of the way, so one thing owns the
# edge:
#
#   docker compose up -d --scale proxy=0
#
# What follows mirrors deploy/nginx/nginx.conf, which is the reference. Two
# differences matter and neither is cosmetic:
#
#   * TLS is on, because a host proxy is the public edge. The session cookie is
#     `Secure`: served over plain HTTP from anything but localhost, the browser
#     drops it and nobody can sign in.
#   * BACKEND_TRUSTED_PROXY_COUNT must match how many proxies sit in front of
#     the application, this one included, or the address in the audit trail and
#     in the honeytoken blocks is the proxy's instead of the client's.
#
# The zone and map directives belong in the http block, not in a server block.
# On a host that already defines zones of these names, rename these rather than
# duplicating them.

limit_req_zone $binary_remote_addr zone=xp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=xp_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=xp_general:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=xp_perip:10m;

map $request_method $xp_method_allowed {
    default 0;
    GET     1;
    HEAD    1;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
    OPTIONS 1;
}

upstream xenoproxy_frontend {
    server 127.0.0.1:8098 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

upstream xenoproxy_api {
    server 127.0.0.1:8097 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Anything addressed to this host by an name we do not serve is answered with
# nothing at all, which is what a scanner deserves.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name xenoproxy.example.org;

    # The only thing plain HTTP is for. Keep the ACME location above it if
    # certificates are renewed over HTTP-01.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xenoproxy.example.org;

    ssl_certificate     /etc/letsencrypt/live/xenoproxy.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xenoproxy.example.org/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    # Hybrid post-quantum key exchange first: a recording made today cannot be
    # decrypted later by a quantum computer. Needs OpenSSL 3.5 or a provider
    # that supplies the group; drop the first entry if nginx refuses to start.
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:xp_ssl:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'" always;

    server_tokens off;
    client_max_body_size 32m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    limit_conn xp_perip 32;
    limit_req_status 429;

    if ($xp_method_allowed = 0) {
        return 405;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";

    # The application trusts these when header authentication is enabled, so a
    # client must never be able to supply its own. Clearing them here is what
    # makes that trust safe.
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Remote-Email "";
    proxy_set_header X-Remote-Groups "";

    location = /api/v1/auth/login {
        limit_req zone=xp_login burst=5 nodelay;
        proxy_pass http://xenoproxy_api;
    }

    location = /api/v1/auth/password {
        limit_req zone=xp_login burst=3 nodelay;
        proxy_pass http://xenoproxy_api;
    }

    # Job progress is server-sent events. Buffering here makes the interface
    # look frozen and then deliver everything at once when the job ends.
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        limit_req zone=xp_general burst=50 nodelay;
        proxy_pass http://xenoproxy_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        limit_req zone=xp_api burst=40 nodelay;
        proxy_pass http://xenoproxy_api;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=xp_general burst=100 nodelay;
        proxy_pass http://xenoproxy_frontend;
        proxy_read_timeout 30s;
    }
}
