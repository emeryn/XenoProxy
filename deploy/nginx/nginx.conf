# XenoProxy edge reverse proxy.
#
# Terminates TLS, owns the security headers, rate limits the sensitive routes and
# forwards to the frontend and backend containers. It is the only component that
# publishes a port.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 32m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;

    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format xenoproxy escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"referrer":"$http_referer","agent":"$http_user_agent","request_id":"$request_id"}';
    access_log /dev/stdout xenoproxy;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Authentication and submission are limited per client address.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=600r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 32;

    # Only the methods the application uses are accepted.
    map $request_method $method_allowed {
        default        0;
        GET            1;
        HEAD           1;
        POST           1;
        PUT            1;
        PATCH          1;
        DELETE         1;
        OPTIONS        1;
    }

    upstream xenoproxy_frontend {
        server frontend:8081 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    upstream xenoproxy_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # A request that matches no server name is answered without revealing anything.
    server {
        listen 8080 default_server;
        http2 on;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        http2 on;
        server_name localhost xenoproxy.localhost;

        # TLS is terminated here in production. Uncomment once certificates are
        # mounted, and keep the hybrid post-quantum key exchange first.
        #
        # listen 8443 ssl;
        # ssl_certificate     /etc/nginx/tls/xenoproxy.crt;
        # ssl_certificate_key /etc/nginx/tls/xenoproxy.key;
        # ssl_protocols TLSv1.3 TLSv1.2;
        # ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
        # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_session_timeout 1d;
        # ssl_session_cache shared:ssl:10m;
        # ssl_session_tickets off;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'" always;

        if ($method_allowed = 0) {
            return 405;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        # Headers an upstream client must never be able to inject.
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Remote-Email "";
        proxy_set_header X-Remote-Groups "";

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://xenoproxy_api;
        }

        location = /api/v1/auth/password {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://xenoproxy_api;
        }

        # Progress streaming must not be buffered or cut short.
        location ~ ^/api/v1/jobs/[^/]+/events$ {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://xenoproxy_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 15m;
            add_header X-Accel-Buffering "no" always;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://xenoproxy_api;
            proxy_read_timeout 180s;
            proxy_send_timeout 60s;
        }

        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass http://xenoproxy_frontend;
            proxy_read_timeout 30s;
        }
    }
}
